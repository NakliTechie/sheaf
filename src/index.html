<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sheaf — PDF editor</title>
  <meta name="description" content="Browser-native PDF editor. One file. No account, no upload, no telemetry, no limits.">
  <meta name="sheaf-version" content="0.2.0">
  <!-- connect-src allows the AI sidecar to reach the user's OWN provider (BYOK, any
       https endpoint they configure) and a local Ollama/LM Studio bridge. With no AI
       configured nothing connects anywhere; with a local model nothing leaves the
       machine. There is no first-party backend to talk to. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'">
  <link rel="stylesheet" href="./ui/theme.css">
  <link rel="stylesheet" href="./ui/layout.css">
</head>
<body>
  <div id="loading-bar"></div>
  <div id="app" data-version="0.2.0">

    <div id="compat">
      <h1>Sheaf needs a modern browser</h1>
      <p>Sheaf uses the File System Access API, IndexedDB, and WebCrypto. Please use a recent Chromium browser (Chrome / Edge / Brave / Arc) for the full experience, or a current Firefox / Safari for open-and-download mode.</p>
    </div>

    <div id="toolbar" role="toolbar" aria-label="Main toolbar"></div>

    <div id="welcome" role="main" aria-label="Open a PDF to get started"></div>

    <div id="body" class="hidden">
      <div id="rail" role="listbox" aria-label="Page thumbnails"></div>
      <div id="viewport" role="application" aria-label="PDF pages" tabindex="0"></div>
    </div>

    <div id="statusbar" role="status" aria-live="polite"></div>
  </div>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root" aria-live="polite"></div>

              send('naklios:tex:cancel', { requestId: requestId });
              reject(new Error('naklios RPC timeout: naklios:tex:compile'));
            }
          }, 2 * 60 * 60 * 1000);
        }).finally(function () { clearTimeout(timer); texCompiles.delete(requestId); });
        compile.id = requestId;
        return compile;
      },
      cancel: function (id) { send('naklios:tex:cancel', { requestId: String(id) }); },
      cache: function () { return rpc('naklios:tex:cache', {}); },
      // Waits for the person to answer the host's dialog.
      clearCache: function () { return rpc('naklios:tex:clearCache', {}, 10 * 60 * 1000); },
    },
    ai: {
      chat: {
        completions: {
          create: createAiCompletion,
        },
      },
      images: {
        generate: createAiImage,
      },
      // Semantic search over the app's own namespace on the connected
      // backend. The host builds/refreshes a local embedding index on first
      // use (one consent prompt) and returns ranked chunks.
      search: function (options) {
        if (!inNakliOS) {
          return Promise.reject(new Error('Not hosted — naklios.ai unavailable standalone'));
        }
        if (!capabilities.aiSearch) {
          return Promise.reject(new Error('NakliOS semantic search is unavailable or not permitted'));
        }
        options = options || {};
        var requestId = 's' + (++rpcCounter) + '_' + Date.now();
        return new Promise(function (resolve, reject) {
          ragSearches.set(requestId, {
            onIndexing: typeof options.onIndexing === 'function' ? options.onIndexing : null,
          });
          pendingRpc.set(requestId, { resolve: resolve, reject: reject });
          send('naklios:rag:search', {
            requestId: requestId,
            query: String(options.query || ''),
            limit: options.limit,
            prefix: options.prefix,
          });
          // Index building embeds every changed chunk locally; allow 15 min.
          setTimeout(function () {
            if (pendingRpc.has(requestId)) {
              pendingRpc.delete(requestId);
              reject(new Error('naklios RPC timeout: naklios:rag:search'));
            }
          }, 15 * 60 * 1000);
        }).finally(function () {
          ragSearches.delete(requestId);
        });
      },
      searchStatus: function () {
        return rpc('naklios:rag:status', {});
      },
      // On-device helpers (common rail step 5). Nothing leaves this browser; the person allows each app once per visit.
      // Embeddings: up to 64 texts, answered as `{ embeddings, dimensions }`.
      experimental_embeddings: function (input) {
        return rpc('naklios:ai:embed', { input: Array.isArray(input) ? input : [input] }, AI_LOCAL_TIMEOUT_MS);
      },
      // Speech to text: 16 kHz mono samples, at most 30 s, answered as `{ text }`. Needs the assistant's model turned on.
      experimental_transcribe: function (audio) {
        return rpc('naklios:ai:transcribe', { audio: audio }, AI_LOCAL_TIMEOUT_MS);
      },
      // Text to speech: at most 1,000 characters, answered as `{ audio, sampleRate }`. Needs the assistant's model turned on.
      experimental_speak: function (text) {
        return rpc('naklios:ai:speak', { text: String(text || '') }, AI_LOCAL_TIMEOUT_MS);
      },
      cancelAll: function () {
        aiRequests.forEach(function (_, requestId) {
          send('naklios:ai:cancel', { requestId: requestId });
        });
        aiImageRequests.forEach(function (_, requestId) {
          send('naklios:ai:cancel', { requestId: requestId });
        });
      },
    },

    // Web search and page reading for agents. The host searches with the person's provider (or Wikipedia) and reads
    // pages directly, through the person's web relay, or through Jina Reader; each site asks the person once.
    experimental_web: {
      // search(query, { maxResults }) -> { provider, results: [{ title, url, snippet }] }
      search: function (query, options) {
        if (!inNakliOS || !capabilities.experimental_web) return Promise.reject(new Error('NakliOS web search is unavailable to this app'));
        return rpc('naklios:web:search', { query: String(query || ''), maxResults: options && options.maxResults }, 120000);
      },
      // fetch(url) -> { url, status, kind: 'html'|'text', content, truncated, via }
      fetch: function (url) {
        if (!inNakliOS || !capabilities.experimental_web) return Promise.reject(new Error('NakliOS page reading is unavailable to this app'));
        return rpc('naklios:web:fetch', { url: String(url || '') }, 120000);
      },
    },

    // Sovereign egress — a cross-origin HTTP request the browser's Same-Origin
    // Policy blocks (git push, arbitrary-host fetch, no-CORS APIs). The host routes
    // it to the user-configured backend (their own Worker or the local bridge); it
    // is NEVER a naklios-hosted proxy. Grant-gated + History-logged host-side.
    // This is the SDK seam: until a host advertises a backend (capabilities.net),
    // every call fails fast with a typed ENOEGRESS — no 30s RPC timeout.
    net: {
      // Synchronous check an app can gate its UI on.
      available: function () { return capabilities.net === true; },
      // { backend: 'worker'|'bridge', roams } — no secrets; null when unavailable.
      info: function () {
        if (!inNakliOS || !capabilities.net) return Promise.resolve(null);
        return rpc('naklios:net:info', {});
      },
      // fetch({ url, method, headers, body }) -> { status, statusText, headers, body }.
      // Binary bodies as ArrayBuffer/Uint8Array; text as string. Buffered in v1.
      fetch: function (req) {
        req = req || {};
        if (!req.url) return Promise.reject(mkEgressErr('EINVAL', 'net.fetch requires a url'));
        if (!inNakliOS || !capabilities.net) {
          return Promise.reject(mkEgressErr('ENOEGRESS', inNakliOS
            ? 'No egress backend configured — connect one in NakliOS settings'
            : 'Not hosted — naklios.net unavailable standalone'));
        }
        return rpc('naklios:net:fetch', {
          url: String(req.url),
          method: req.method || 'GET',
          headers: req.headers || {},
          body: req.body != null ? req.body : null,
        }, req.timeoutMs);
      },
    },
  };
})();

/* naklios-sdk:end */
  </script>
  <script type="module" src="./app.js"></script>
